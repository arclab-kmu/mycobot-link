[package]
name = "mycobot-arm"
version = "0.1.0"
edition = "2024"
# File::try_lock (the vendor's /tmp/mycobot_lock) is 1.89.
rust-version = "1.89"
description = "myCobot 280 JN arm server: the last check between the brain and the serial line"
license = "MIT"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Opened by path, so no libudev: it would also block a static musl build.
serialport = { version = "4", default-features = false }

[profile.release]
strip = true
