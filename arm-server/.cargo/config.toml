# Jetson Nano build from any host: a static musl binary sidesteps the Jetson's
# old glibc (2.31-0ubuntu9.18, read off the lab's Nano on 2026-10-27). The Nano
# also has cargo, and a native `cargo build --release --locked` there takes ~1 min.
#   rustup target add aarch64-unknown-linux-musl
#   cargo build --release --target aarch64-unknown-linux-musl
[target.aarch64-unknown-linux-musl]
linker = "rust-lld"
