[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mycobot-brain"
version = "0.1.0"
description = "DGX Spark side of mycobot-link: listens for the myCobot arm server, asks vLLM for a move, sends skill requests."
# Runs on the Spark (Ubuntu 24.04). TODO(unverified): the Spark's python3 version
# was not read; 3.10 is the floor the code needs (PEP 604 unions in signatures).
requires-python = ">=3.10"
authors = [{ name = "Hojin Kim" }]
license = "MIT"

# None. The link is stdlib sockets and the vLLM call is stdlib urllib, so the
# brain installs offline and never pulls a second copy of anything vLLM ships.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "jsonschema>=4.18"]

[project.scripts]
mycobot-brain = "mycobot_brain.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mycobot_brain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
